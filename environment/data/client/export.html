<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Export entry</title>

<body onload="CV.banner()">
<div id="banner"></div>
<h1>Export entry</h1>
<form id="entry" method="post" action="http://gateway.desk.local/entries/export" onsubmit="return CV.entry.submit(this, 'EX');">
<div id="checks" class="summary">Check before lodging: <a href="#txtWeight">gross weight</a> | <a href="#txtpkgs">packages</a></div>
<table class="keyed">
<tr><th><label for="txtRef">Our reference</label></th><td><input type="text" id="txtRef" size="40" /></td></tr>
<tr><th><label for="txtParty">Exporter</label></th><td><input type="text" id="txtParty" size="40" /></td></tr>
<tr><th><label for="txaAddr">Exporter address</label></th><td><textarea id="txaAddr" rows="4" cols="70"></textarea></td></tr>
<tr><th><label for="txtInvDate">Invoice date</label></th><td><input type="text" id="txtInvDate" size="40" /></td></tr>
<tr><th><label for="txtArrDate">Sailing date</label></th><td><input type="text" id="txtArrDate" size="40" /></td></tr>
<tr><th><label for="selCurrency">Invoice currency</label></th><td><select id="selCurrency"><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option><option value="CAD">CAD</option><option value="CNY">CNY</option><option value="JPY">JPY</option><option value="MXN">MXN</option></select></td></tr>
<tr><th><label for="txtFreight">Freight (invoice currency)</label></th><td><input type="text" id="txtFreight" size="40" /></td></tr>
<tr><th><a name="txtWeight"></a><label for="txtWeight">Gross weight</label></th><td><input type="text" id="txtWeight" size="40" /></td></tr>
<tr><th><a name="txtpkgs"></a><label for="txtPkgs">Packages</label></th><td><input type="text" id="txtPkgs" size="40" /></td></tr>
<tr><th><label for="txtCntrs">Container numbers</label></th><td><input type="text" id="txtCntrs" size="40" /></td></tr>
<tr><th><label for="txaLines">Invoice lines (paste from the invoice sheet)</label></th><td><textarea id="txaLines" rows="8" cols="70"></textarea></td></tr>
</table>
<div class="posted">
<input type="hidden" name="ref" value="" />
<input type="hidden" name="ref_seq" value="" />
<input type="hidden" name="party" value="" />
<input type="hidden" name="addr1" value="" />
