[task]
name = "afterquery/ie-mode-postback"

[metadata]
author_name = "Thomas Morison"
author_email = "matiasv931026@gmail.com"
difficulty_explanation = "A front-end engineer who supports legacy line-of-business clients does this when a desktop program that embeds Internet Explorer is retired and the business needs to know what it actually sent. The client, its three screens and the keyed entries are synthetic but follow a customs brokerage's entry workflow: dates keyed in US, European, UK and ISO forms, invoice lines pasted from spreadsheets with blank cells and from web shops with soft hyphens and other invisible marks, names and addresses pasted with non-breaking and wide spaces, German names with sharp s, zero-padded counts and container numbers. There are 1,644 entries (807 import, 399 export, 438 amend) and 92,064 posted values, 56 per entry. Truth was captured on Windows 11 25H2 (build 26200) by a .NET Framework 4.8 Windows Forms program with no Internet Explorer feature controls, loading each entry's screen in its WebBrowser control (MSHTML 11.1882.26100.0, en-US, Eastern time), setting the keyed controls through COM, clicking Lodge entry and reading every named control of the form in the Navigating event before cancelling the navigation; the posts were never computed by the reference. Every entry was recorded twice in separate processes and both passes agreed on every value. A guard dropped 545 of 2,600 recorded entries in which an IE7- or IE8-mode screen calls toFixed on a value between 0 and 1, because Microsoft documents a JScript 5.x defect there and the input cannot settle whether the Windows 11 engine keeps it. A second guard dropped 411 of the remaining 2,055 because their values also rest on something the input cannot settle: 174 IE7- or IE8-mode entries whose address starts or ends with a blank line, the only inputs where dropping every empty piece of a split and dropping only the inner ones disagree, and Microsoft's MS-ES3 notes on JScript's split support the second reading; 58 entries with a local date before 2007 between the second Sunday of March and the last Sunday of April or between the last Sunday of October and the first Sunday of November, where Windows applies its earliest daylight-saving rule to every older year while the time-zone database follows the historical US rules, so a local midnight can fall on either side of a change; and 188 IE11-mode entries whose invoice date is on day 1 to 9, the only place that mode's toDateString day format shows, where JScript's unpadded day and the padded day of other engines are both plausible (some entries met more than one condition). The engine exists only on Windows, so the posts cannot be reproduced in the Linux container. The solver has to work out the document mode of each screen: import.html declares IE=8; export.html declares IE=8 after a script element, so the meta is ignored and the control's IE7 default applies, which also loads json2.js through a conditional comment; amend.html declares IE=edge. In IE7 mode getElementById also matches name attributes, ignoring case, so the validation anchors named txtWeight and txtpkgs, which come before their controls, hide the weight and package controls from the script. The solver must then model where JScript in the legacy modes and Chakra in every mode differ from a modern engine, and how the DOM stores what the script writes: the posted address block is a textarea, which in IE7 and IE8 modes turns every LF the script writes into CR LF (the journal's read-backs show the same split, CR LF kept in the legacy screens and folded to LF in IE11 mode), the arrival date goes through toLocaleDateString, which is the Windows long date before IE9 mode and an ECMA-402 short date wrapped in left-to-right marks in IE11 mode, and the invoice year goes through getYear, which JScript documents as the full year outside 1900-1999 and ES5 defines as the year less 1900. Running the shipped scripts in Node gets 15,964 values wrong, in every one of the 1,644 entries (15,765 with the time zone set to Eastern). Measured footprints out of 92,064 values, each with everything else right: every screen taken as IE11 mode 13,348; regex split keeping empty fields in IE7/IE8 modes 2,807; the export screen taken as IE8 mode 1,643; parseInt without a radix being decimal in IE7/IE8 modes 1,567; ISO dates read as local dates in IE7/IE8 modes 1,543; two-digit years read as 2000-2049 as V8 does instead of 19xx 1,423; substr(-6) working in IE7/IE8 modes 1,206; the textarea keeping the LF the script wrote in IE7/IE8 modes 1,206; getElementById ignoring name attributes in IE7 mode 1,197; \\s matching Unicode spaces in IE7/IE8 modes 1,112; toLocaleDateString formatted as an ECMA-402 short date in every mode 1,030; getYear taken as ES5 in IE7/IE8 modes 866; toLocaleString formatting as ECMA-402 in IE7/IE8 modes 807; toFixed rounding the binary value instead of the shortest decimal form 492; toLocaleDateString in IE11 mode without the left-to-right marks 438; day/month overflow rejected instead of rolled over 412; the getElementById name match taken as case-sensitive 399; getYear taken as JScript in IE11 mode 394; toDateString padding the day in IE7/IE8 modes 336; string indexing working in IE7 mode 308; ISO dates in IE11 mode not moved to the Eastern evening before 252; sharp s upper-cased to SS 215; native JSON escaping in IE7 mode instead of json2.js 138. Most of an expert's time goes on the document-mode and DOM rules and on separating what the JScript 5.8 compatibility of the legacy modes keeps from what Chakra changes in every mode."
solution_explanation = "solution/solve.py reads /app/data only. It finds each screen's document mode from its head: an X-UA-Compatible meta counts only if no script element comes before it, the highest IE=n or IE=edge value wins, and otherwise a page with a DOCTYPE gets the WebBrowser control's IE7 default. Below IE8 mode it treats a keyed control as unreadable (undefined) when the first element in the body whose id or name equals its id, ignoring case, is a different element. It then reimplements js/entry.js, js/util.js and js/rates.js for each journal entry with the engine's behaviour for that mode. In IE7 and IE8 modes, \\s and the trim fallback know only ASCII blanks, split with a regular expression drops every empty string, parseInt without a radix reads a leading 0 as octal, substr with a negative start returns the whole string, ISO date strings are invalid, toDateString does not pad the day, and toLocaleString uses the Windows number format with two decimals. In IE7 mode indexing a string gives undefined, so every container check fails, and JSON comes from json2.js, whose quote() escapes soft hyphens, directional and zero-width joiners, word joiners and byte order marks. In every mode, toFixed rounds half up on the shortest decimal form of the number; new Date reads m/d/y with two-digit years as 19xx and rolls months and days over without range checks; month names are matched by prefix; ISO dates in IE11 mode are UTC midnight and so the evening before in Eastern time; and toUpperCase maps one character to one, leaving sharp s. The address block is the non-empty address fields joined by CR LF in IE7 and IE8 modes, where the textarea stores the script's LF as CR LF, and by LF in IE11 mode. getYear is the full year outside 1900-1999 in IE7 and IE8 modes and the year less 1900 in IE11 mode. toLocaleDateString is the en-US Windows long date (dddd, MMMM d, yyyy) in IE7 and IE8 modes and M/D/YYYY with a left-to-right mark before and after each field's digits in IE11 mode. Rates come from the table in rates.js with its fallback. It writes /app/output/postback.json in about one second."
verification_explanation = "The verifier runs in its own container and only parses /app/output/postback.json, which must be a regular file of at most 64 MiB holding a UTF-8 JSON object (a byte order mark is accepted); it never runs anything from the agent. tests/expected.json holds the 92,064 values recorded from MSHTML for 1,644 entries, not produced by the reference. There are eight tests: exactly the journal's entry ids; exactly the 56 named controls for every entry, and that every recorded control is covered by one of the value tests; and six tests comparing every value, as a string, character for character, for the reference fields, party and address, dates and rate, totals, cargo fields, and invoice lines. Extra top-level keys and key order are ignored. test.sh writes reward 0 first, writes 1 only if all tests pass, and writes a CTRF report. Run three times in the environment image, the reference got 1 each time with byte-identical output. Fourteen hand-made outputs were scored against the built tests image. The reference, a copy with a byte order mark and a reordered, indented copy with an extra top-level key get 1. A missing entry, an extra entry, a missing control, an extra control, a number instead of a string, a null value, one extra character in one value, entries given as a list, an empty file, a symlink and a file over 64 MiB get 0. Each case corresponds to a sentence of the instruction."
category = "Software"
subcategory = "Frontend"
